<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <title>Website Relaunch | Gritstone Technologies</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="top-accent" aria-hidden="true"></div>
  <main>
    <section class="countdown-panel" aria-labelledby="countdown-heading">
      <header>
        <a class="brand" id="brand-link" href="https://gritstonetech.com/" aria-label="Website home">
          <img class="brand-logo" id="brand-logo" src="assets/gritstone-logo.svg" alt="Logo" width="234" height="40">
        </a>
        <p class="brand-subheading" id="brand-subheading" hidden></p>
      </header>
      <p class="eyebrow" id="eyebrow">gritstonetech.com</p>
      <h1 id="countdown-heading">Relaunching in</h1>
      <div class="timer" aria-label="Time remaining until the website relaunch">
        <div class="time-unit"><span class="value" id="hours">00</span><span class="label">Hours</span></div>
        <div class="time-unit"><span class="value" id="minutes">00</span><span class="label">Minutes</span></div>
        <div class="time-unit"><span class="value" id="seconds">00</span><span class="label">Seconds</span></div>
      </div>
      <p class="status" id="status" role="status">Set up your launch to start the countdown.</p>
    </section>
  </main>

  <canvas id="confetti-canvas" aria-hidden="true"></canvas>
  <div class="celebration" id="celebration" aria-hidden="true">
    <div>
      <svg class="celebration-check" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring" cx="50" cy="50" r="46"></circle>
        <circle cx="50" cy="50" r="46"></circle>
        <path d="M30 51 L44 65 L71 37"></path>
      </svg>
      <h2 class="celebration-title">We’re <span>live!</span></h2>
      <p class="celebration-sub" id="celebration-sub">Taking you to the new site…</p>
    </div>
  </div>

  <div class="site-layer" id="site-layer" aria-hidden="true">
    <iframe id="site-frame" title="Gritstone Technologies website"></iframe>
    <a class="site-url" id="site-url" target="_top"></a>
  </div>
  <div class="load-progress" id="load-progress" aria-hidden="true"><span></span></div>

  <button class="edit-button" id="edit-button" type="button" aria-label="Edit launch settings"><span class="edit-icon" aria-hidden="true">✎</span></button>
  <div class="edit-tip" id="edit-tip" role="status">Settings saved. Use this button to edit them anytime.</div>

  <div class="setup" id="setup" role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <form class="setup-card" id="setup-form" novalidate>
      <h2 id="setup-title">Launch settings</h2>
      <p>Saved in this browser. Press Start to begin the countdown.</p>
      <div class="field-row">
        <div class="field">
          <label for="cfg-accent">Accent</label>
          <input id="cfg-accent" type="color" value="#b20d24">
        </div>
        <div class="field">
          <label for="cfg-page-title">Page title (optional)</label>
          <input id="cfg-page-title" type="text" placeholder="Defaults to heading | subheading or site name">
        </div>
      </div>
      <hr class="setup-divider">
      <div class="field">
        <label for="cfg-site-url">Site URL</label>
        <input id="cfg-site-url" type="url" placeholder="https://example.com/" required>
      </div>
      <div class="field">
        <label for="cfg-logo">Logo URL (optional)</label>
        <div class="logo-input">
          <img class="logo-preview" id="cfg-logo-preview" alt="" hidden>
          <input id="cfg-logo" type="text" placeholder="assets/gritstone-logo.svg">
          <button class="btn-find" type="button" id="cfg-logo-find">Find</button>
        </div>
      </div>
      <div class="field">
        <label for="cfg-subheading">Subheading under logo (optional)</label>
        <input id="cfg-subheading" type="text" placeholder="e.g. a subsidiary or product name">
      </div>
      <div class="field">
        <label for="cfg-heading">Heading</label>
        <input id="cfg-heading" type="text" placeholder="Relaunching in" required>
      </div>
      <div class="field">
        <label for="cfg-launch">Launch date &amp; time (your local time)</label>
        <input id="cfg-launch" type="datetime-local" required>
      </div>
      <p class="setup-error" id="setup-error" role="alert"></p>
      <div class="setup-actions">
        <button class="btn-secondary" type="button" id="setup-cancel">Cancel</button>
        <button class="btn-primary" type="submit" id="setup-start">Start</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
